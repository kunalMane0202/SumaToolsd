spring.application.name=suma-tracking-backend

# ---------- Database connection ----------
# Where the database is: this computer (localhost), port 5432, database suma_tracking
spring.datasource.url=jdbc:postgresql://localhost:5432/suma_tracking
# The normal app user (never the postgres admin)
spring.datasource.username=suma_app
# The password is NOT written here. It is read from your terminal (SUMA_DB_PASSWORD).
spring.datasource.password=${SUMA_DB_PASSWORD}

# ---------- Tables ----------
# Only Flyway is allowed to create or change tables. Java code must never do it by itself.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Close database connections early (safer and faster)
spring.jpa.open-in-view=false
# Save all dates and times in UTC; we convert to India time when showing them
spring.jpa.properties.hibernate.jdbc.time_zone=UTC